[project]
name = "sandbox-transformers"
version = "0.1.0"
description = "Sandbox for experimenting with Hugging Face Transformers and PyTorch"
requires-python = ">=3.11"
dependencies = [
    "transformers[torch]>=5.0",
    "torch",
    "accelerate",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
]
